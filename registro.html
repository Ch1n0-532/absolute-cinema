<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Reseña - Absolute Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="javascript/app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

</head>
<body class="bg-dark text-white" x-data="cinemaApp">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Absolute Cinema</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="catalogo.html">Catálogo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="registro.html">Nueva Reseña</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 600px;">
        <h2 class="mb-4 text-center">Escribir una Reseña</h2>

        
        <template x-if="mensajeAlerta">
            <div :class="'alert alert-' + mensajeAlerta.tipo + ' alert-dismissible fade show'" role="alert">
                <span x-text="mensajeAlerta.texto"></span>
                <button type="button" @click="mensajeAlerta = null" class="btn-close" aria-label="Close"></button>
            </div>
        </template>


        <form @submit.prevent="enviarResena" class="bg-black p-4 rounded border border-secondary">

            <div class="mb-3">
                <label for="nombreUsuario" class="form-label">Tu Nombre o Usuario</label>
                <input type="text" id="nombreUsuario" x-model="nombreUsuario" class="form-control bg-dark text-white border-secondary" placeholder="Ej: PeterParker20">
            </div>

            <div class="mb-3">
                <label for="selectPelicula" class="form-label">Película</label>
                <select id="selectPelicula" x-model="peliculaSeleccionada" class="form-select bg-dark text-white border-secondary">
                    <option value="">-- Selecciona una película --</option>
                    <template x-for="p in peliculas" :key="p.id">
                        <option :value="p.titulo" x-text="p.titulo"></option>
                    </template>
                </select>
            </div>

            <div class="mb-3">
                <label for="puntuacion" class="form-label">Puntuación</label>
                <select id="puntuacion" x-model="puntuacion" class="form-select bg-dark text-white border-secondary">
                    <option value="">-- ¿Cuántas estrellas le das? --</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="textoResena" class="form-label">Tu Opinión</label>
                <textarea id="textoResena" x-model="textoResena" class="form-control bg-dark text-white border-secondary" rows="4" placeholder="Escribe aquí tu reseña sobre la película..."></textarea>
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-bold">Publicar Reseña</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
